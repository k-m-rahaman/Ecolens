# Deploy this independently from the private local scanning app.
name = "ecolens-naac-public"
main = "naac-worker.mjs"
compatibility_date = "2026-10-13"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./naac"
binding = "ASSETS"
run_worker_first = ["/api/naac/*"]

[vars]
# Enable after creating D1 and entering its binding below.
NAAC_SHARING_ENABLED = "0"
# Exact origins of authorized publishers, separated by commas. No wildcard.
NAAC_ALLOWED_ORIGINS = "http://127.0.0.1:8787,http://localhost:8787"
NAAC_PUBLISHES_PER_MINUTE = "4"
NAAC_PUBLISHES_PER_IP_DAY = "60"
NAAC_PUBLISHES_PER_DAY = "500"

# Uncomment and enter the D1 database id after creating the free database.
# [[d1_databases]]
# binding = "NAAC_DB"
# database_name = "ecolens-naac"
# database_id = "ENTER_CREATED_DATABASE_ID"
