<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="bannerTitle bannerDesc">
<title id="bannerTitle">EcoLens Pro — Small actions. A greener campus.</title>
<desc id="bannerDesc">A green EcoLens banner with the original leaf and lens logo and a three-step journey: scan, sort, grow.</desc>
<defs><linearGradient id="forest" x2="1" y2="1"><stop stop-color="#0e3024"/><stop offset="1" stop-color="#1a523d"/></linearGradient></defs>
<style>
  text{font-family:Segoe UI,Arial,sans-serif}.brand{font-size:36px;font-weight:750;fill:#fff}.pro{font-size:14px;font-weight:700;letter-spacing:3px;fill:#bcf173}.headline{font-size:58px;font-weight:750;letter-spacing:-1.5px;fill:#f6faef}.accent{fill:#bcf173}.caption{font-size:21px;fill:#c0d8c8}.step{font-size:19px;font-weight:750;letter-spacing:2px;fill:#f6faef}.detail{font-size:17px;fill:#c0d8c8}.number{font-size:20px;font-weight:700;fill:#163c2c}
</style>
<rect width="1200" height="380" rx="28" fill="url(#forest)"/>
<circle cx="1170" cy="35" r="220" fill="#8fd3b2" opacity=".07"/>
<circle cx="1170" cy="35" r="170" fill="none" stroke="#8fd3b2" opacity=".15"/>
<circle cx="680" cy="350" r="150" fill="none" stroke="#bcf173" opacity=".07"/>
<g transform="translate(50 28) scale(.54)">
  <circle cx="80" cy="80" r="73" fill="#174d3a"/>
  <path d="M126 42a60 60 0 1 0 12 55" fill="none" stroke="#8fd3b2" stroke-width="6" stroke-linecap="round"/>
  <circle cx="137" cy="61" r="7" fill="#bcf173"/>
  <circle cx="80" cy="80" r="39" fill="#24694e" stroke="#8fd3b2" stroke-width="3"/>
  <g fill="none" stroke="#8fd3b2" stroke-width="2.5" stroke-linecap="round" opacity=".65">
    <path d="M79 42c-22 21-22 55 0 76M42 80h76M48 100c18-8 46-8 64 0"/>
  </g>
  <path d="M54 101C49 78 62 56 108 49c4 31-20 55-54 52Z" fill="#bcf173"/>
  <path d="m60 95 37-34M75 80l-1-13" fill="none" stroke="#174d3a" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
</g>
<text x="150" y="80" class="brand">EcoLens</text><text x="296" y="79" class="pro">PRO</text>
<text x="62" y="195" class="headline">Small actions.</text>
<text x="62" y="261" class="headline accent">A greener campus.</text>
<text x="64" y="318" class="caption">AI-assisted sorting. Everyday progress.</text>
<g transform="translate(790 55)">
  <rect width="342" height="78" rx="18" fill="#ffffff" opacity=".07"/><circle cx="42" cy="39" r="21" fill="#bcf173"/><text x="36" y="46" class="number">1</text><text x="80" y="32" class="step">SCAN</text><text x="80" y="57" class="detail">Look at each visible item</text>
</g>
<g transform="translate(790 151)">
  <rect width="342" height="78" rx="18" fill="#ffffff" opacity=".07"/><circle cx="42" cy="39" r="21" fill="#8fd3b2"/><text x="36" y="46" class="number">2</text><text x="80" y="32" class="step">SORT</text><text x="80" y="57" class="detail">Follow your campus labels</text>
</g>
<g transform="translate(790 247)">
  <rect width="342" height="78" rx="18" fill="#ffffff" opacity=".07"/><circle cx="42" cy="39" r="21" fill="#d7e6bb"/><text x="36" y="46" class="number">3</text><text x="80" y="32" class="step">GROW</text><text x="80" y="57" class="detail">Build habits. Earn XP.</text>
</g>
</svg>
